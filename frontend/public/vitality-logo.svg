<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 150" width="140" height="150">
  <defs>
    <path
      id="heart-apple-path"
      d="M 70 48 C 56 30, 24 36, 24 64 C 24 88, 50 103, 70 113 C 90 103, 116 88, 116 64 C 116 36, 84 30, 70 48 Z"
    />
    <clipPath id="q-tl"><rect x="0" y="0" width="70" height="69" /></clipPath>
    <clipPath id="q-tr"><rect x="70" y="0" width="70" height="69" /></clipPath>
    <clipPath id="q-bl"><rect x="0" y="69" width="70" height="60" /></clipPath>
    <clipPath id="q-br"><rect x="70" y="69" width="70" height="60" /></clipPath>
  </defs>

  <!-- Hojas superiores -->
  <path d="M 67 38 C 66 24, 56 18, 47 15 C 47 26, 54 36, 67 38 Z" fill="#2ea44f" />
  <path d="M 66 37 C 61 29, 55 23, 50 19" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.85" />

  <path d="M 72 38 C 72 19, 86 12, 102 6 C 102 24, 91 38, 72 38 Z" fill="#8cc63f" />
  <path d="M 73 37 C 81 26, 89 19, 97 12" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />

  <!-- Fondo blanco interno de la manzana-corazón -->
  <use href="#heart-apple-path" fill="#ffffff" />

  <!-- Contorno en 4 cuadrantes -->
  <use href="#heart-apple-path" fill="none" stroke="#8cc63f" stroke-width="7.5" stroke-linejoin="round" clip-path="url(#q-tl)" />
  <use href="#heart-apple-path" fill="none" stroke="#2ea44f" stroke-width="7.5" stroke-linejoin="round" clip-path="url(#q-tr)" />
  <use href="#heart-apple-path" fill="none" stroke="#f36f21" stroke-width="7.5" stroke-linejoin="round" clip-path="url(#q-bl)" />
  <use href="#heart-apple-path" fill="none" stroke="#e1251b" stroke-width="7.5" stroke-linejoin="round" clip-path="url(#q-br)" />

  <!-- Tenedor naranja inclinado (izquierda) -->
  <g transform="translate(54, 78) rotate(-29)">
    <rect x="-7.5" y="-26" width="3.2" height="15" rx="1.6" fill="#f38b1e" />
    <rect x="-1.6" y="-26" width="3.2" height="15" rx="1.6" fill="#f38b1e" />
    <rect x="4.3" y="-26" width="3.2" height="15" rx="1.6" fill="#f38b1e" />
    <path d="M -7.5 -13 L 7.5 -13 L 7.5 -9 C 7.5 -3, 4 -1, 2.2 0.5 L 3.2 26 C 3.3 29, 1.5 31, 0 31 C -1.5 31, -3.3 29, -3.2 26 L -2.2 0.5 C -4 -1, -7.5 -3, -7.5 -9 Z" fill="#f38b1e" />
  </g>

  <!-- Corazón rojo (derecha) -->
  <path
    d="M 86 64 C 81 56, 69 58, 69 68 C 69 78, 80 84, 86 88 C 92 84, 103 78, 103 68 C 103 58, 91 56, 86 64 Z"
    fill="#e1251b"
  />

  <!-- Nombre Vitality debajo -->
  <text
    x="70"
    y="139"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif"
    font-size="24"
    font-weight="800"
    letter-spacing="-0.5"
    fill="#13221d"
  >
    Vitality
  </text>
</svg>
